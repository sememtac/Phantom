; PHANTOM - a wireframe dogfight sim for the
; Waveshare ESP32-S3-Touch-AMOLED-2.16 (480x480 CO5300, CST9220 touch, QMI8658 IMU).
;
; The board port is deliberately thin: no LVGL, no PMU, no HAL indirection. The
; render loop owns the panel so it can push whole bands straight down the QSPI
; bus without going through a widget toolkit.

[env:amoled216]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
; The ROM banner says mode:DIO and so does the image header, and BOTH mislead: the
; banner describes the ROM's own conservative load of the bootloader, and the second
; stage -- built for qio_opi -- upgrades the cache-fill mode to QIO regardless of the
; header. Verified 2026-08-20 by reading SPI_MEM_CTRL_REG(0) at init (vg_rast_init
; prints it): FREAD_QIO set, four data lines, always was. Do not chase the banner.
upload_speed = 921600
monitor_speed = 115200

; The Arduino core ships -Os. The rasteriser and the per-vertex transform are the
; whole frame budget, so trade flash (we use a fraction of it) for speed.
build_unflags = -Os
build_flags =
    -O2
    -ffast-math
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    ; THE PORT BELONGS TO THE SESSION, so the core does not get to write to it.
    ;
    ; ARDUHAL's log_e goes to printf, not to esp_log_write, so the log sink in
    ; vg_capture.cpp cannot intercept it -- it has to be compiled out instead. The I2S
    ; driver logs ESP_ERR_TIMEOUT every 22 ms while the audio ring settles after a reset,
    ; and with the host reading frames by then a record ended after ONE frame, having read
    ; "[  2900][E][ESP_I2S.cpp" where a frame record belonged.
    ;
    ; It survived years by luck: the host scans for the session header before reading
    ; frames, so a burst arriving BEFORE the header was skipped. Making the game faster
    ; moved the header in front of the burst.
    ;
    ; Nothing is lost that this project uses. Its own diagnostics are the telemetry line,
    ; the crumb trail in RTC memory and the crash record -- none of which go through
    ; ARDUHAL. The sink stays for IDF component logs, which do.
    -DCORE_DEBUG_LEVEL=0

; The panel is driven directly by vg_port_co5300.cpp (QSPI clock is set there,
; LCD_CLOCK_HZ). Arduino_GFX was dropped: its writePixels() byte-swaps every
; pixel on the CPU into a bounce buffer, which cost ~13 ms/frame on top of the
; ~11.5 ms the wire needs, and it exposes no zero-copy path.
lib_deps =
    ; Provides BOTH SensorQMI8658 (IMU) and TouchDrvCSTXXX (CST9220 touch).
    lewisxhe/SensorLib@^0.2.6
