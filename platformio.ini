; VECTOR DRIFT - a wireframe space flight sim for the
; Waveshare ESP32-S3-Touch-AMOLED-2.16 (480x480 CO5300, CST9220 touch, QMI8658 IMU).
;
; Pin map and panel bring-up are lifted from the Clawdmeter firmware's board port
; (F:\Clawdmeter\firmware\src\boards\waveshare_amoled_216), but this project shares
; no code with it: no LVGL, no PMU, no HAL indirection. The render loop owns the
; panel so it can push whole bands without going through a widget toolkit.

[env:amoled216]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
upload_speed = 921600
monitor_speed = 115200

; The Arduino core ships -Os. The rasteriser and the per-vertex transform are the
; whole frame budget, so trade flash (we use a fraction of it) for speed.
build_unflags = -Os
build_flags =
    -O2
    -ffast-math
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

; The panel is driven directly by vg_port_co5300.cpp (QSPI clock is set there,
; LCD_CLOCK_HZ). Arduino_GFX was dropped: its writePixels() byte-swaps every
; pixel on the CPU into a bounce buffer, which cost ~13 ms/frame on top of the
; ~11.5 ms the wire needs, and it exposes no zero-copy path.
lib_deps =
    ; Provides BOTH SensorQMI8658 (IMU) and TouchDrvCSTXXX (CST9220 touch).
    lewisxhe/SensorLib@^0.2.6
